name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  deploy:
    # Deploys the FastAPI app to AWS Lambda (handler: app.main.handler).
    # Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
    # Create the Lambda function + API Gateway HTTP API once (see README).
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package Lambda zip
        run: |
          mkdir -p package
          pip install --target ./package -r requirements.txt --platform manylinux2014_x86_64 --only-binary=:all: --implementation cp --python-version 3.11
          cp -r app package/
          cd package && zip -r ../lambda_package.zip . -x "*.pyc" "*__pycache__*"
      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-1
          function_name: smart-business-assistant
          zip_file: lambda_package.zip
