<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Business Assistant</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --me:#0ea5e9; --bot:#334155; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #e2e8f0;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid #334155;
           display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 1.05rem; font-weight: 600; }
  #status { font-size: .75rem; color: #94a3b8; margin-left: auto; }
  #status.on { color: #4ade80; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.45;
         white-space: pre-wrap; word-wrap: break-word; font-size: .92rem; }
  .me  { background: var(--me); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .typing { color: #94a3b8; font-style: italic; }
  form { display: flex; gap: 10px; padding: 14px 20px; background: var(--panel);
         border-top: 1px solid #334155; }
  input { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #475569;
          background: #0f172a; color: #e2e8f0; font-size: .95rem; outline: none; }
  input:focus { border-color: var(--accent); }
  button { padding: 11px 22px; border: none; border-radius: 10px; background: var(--accent);
           color: #06283d; font-weight: 600; cursor: pointer; font-size: .95rem; }
  button:disabled { opacity: .5; cursor: default; }
  #upload { padding: 11px 14px; background: #334155; color: #e2e8f0; }
  #upload:hover { background: #475569; }
</style>
</head>
<body>
<header>
  <span style="font-size:1.3rem">🤖</span>
  <h1>Smart Business Assistant</h1>
  <span id="status">connecting…</span>
</header>
<div id="chat">
  <div class="msg bot">Hi! I can answer questions from the company documents, add contacts to the CRM, or send emails. Try: <b>"What is the refund policy?"</b></div>
</div>
<form id="form">
  <input type="file" id="file" accept=".pdf,.md,.txt" style="display:none" />
  <button type="button" id="upload" title="Upload a document (.pdf, .md, .txt)">📎 Upload</button>
  <input id="input" placeholder="Type a message…" autocomplete="off" autofocus />
  <button id="send" type="submit">Send</button>
</form>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const status = document.getElementById('status');
  const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);
  let ws = null;

  function add(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/${sessionId}`);
    ws.onopen = () => { status.textContent = 'connected'; status.className = 'on'; };
    ws.onclose = () => { status.textContent = 'offline (REST fallback)'; status.className = ''; ws = null; };
    ws.onmessage = (e) => {
      const t = chat.querySelector('.typing');
      if (t) t.remove();
      add(e.data, 'bot');
      send.disabled = false;
    };
  }
  connect();

  async function sendRest(message) {
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId })
      });
      const data = await res.json();
      const t = chat.querySelector('.typing');
      if (t) t.remove();
      add(res.ok ? data.response : ('Error: ' + (data.detail || res.status)), 'bot');
    } catch (err) {
      const t = chat.querySelector('.typing');
      if (t) t.remove();
      add('Network error: ' + err.message, 'bot');
    }
    send.disabled = false;
  }

  const uploadBtn = document.getElementById('upload');
  const fileInput = document.getElementById('file');
  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    add(`Uploading "${file.name}"…`, 'bot typing');
    uploadBtn.disabled = true;
    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/upload', { method: 'POST', body: fd });
      const data = await res.json();
      const t = chat.querySelector('.typing');
      if (t) t.remove();
      add(res.ok ? '📄 ' + data.message : 'Upload failed: ' + (data.detail || res.status), 'bot');
    } catch (err) {
      const t = chat.querySelector('.typing');
      if (t) t.remove();
      add('Upload error: ' + err.message, 'bot');
    }
    uploadBtn.disabled = false;
    fileInput.value = '';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    add(message, 'me');
    add('assistant is thinking…', 'bot typing');
    input.value = '';
    send.disabled = true;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(message);
    else sendRest(message);
  });
</script>
</body>
</html>
